<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnolia Celebration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: white;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    transition: background 1s ease;
}

body.playing {
    background: black;
}

#intro {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    z-index: 10;
    transition: opacity 1s ease;
}

#playButton {
    width: 0;
    height: 0;
    border-top: 28px solid transparent;
    border-bottom: 28px solid transparent;
    border-left: 42px solid black;
    background: none;
    cursor: pointer;
    margin-left: 10px;
}

#intro.hidden {
    opacity: 0;
    pointer-events: none;
}

#scene {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
}

#scene.visible {
    opacity: 1;
}

#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}

#poster {
    position: fixed;
    width: min(72vw, 340px);
    max-height: 65vh;
    object-fit: contain;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    z-index: 3;
    pointer-events: none;
}

#poster.show {
    animation: posterIn 0.5s ease forwards;
}

#poster.hide {
    animation: posterOut 0.5s ease forwards;
}

@keyframes posterIn {
    from {
        opacity: 0;
        transform: translate(-50%, -47%) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes posterOut {
    from {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    to {
        opacity: 0;
        transform: translate(-50%, -53%) scale(1.02);
    }
}

.lyric {
    position: absolute;
    max-width: 85%;
    font-size: clamp(18px, 4vw, 30px);
    font-weight: bold;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 0 10px currentColor;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    z-index: 2;
}

.lyric.show {
    opacity: 1;
    transform: translateY(0);
}

.red {
    color: #ff3030;
    text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 30px #a00000;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(88%, 450px);
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.6s ease;
}

#controls.visible {
    opacity: 1;
}

#pauseButton {
    background: transparent;
    border: 1px solid #777;
    border-radius: 50%;
    color: white;
    width: 36px;
    height: 36px;
    cursor: pointer;
    flex-shrink: 0;
}

#progress {
    flex: 1;
    accent-color: white;
    min-width: 0;
}

#time {
    font-size: 12px;
    color: #ccc;
    white-space: nowrap;
}

@media (max-width: 480px) {
    .lyric {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div id="intro">
    <button id="playButton" aria-label="Putar lagu"></button>
</div>

<div id="scene">
    <img id="poster" src="poster.jpg" alt="Magnolia Celebration">

    <div id="lyrics"></div>

    <canvas id="snow"></canvas>
</div>

<div id="controls">
    <button id="pauseButton" aria-label="Jeda lagu">Ⅱ</button>
    <input id="progress" type="range" min="0" max="39" step="0.05" value="0">
    <span id="time">0:00</span>
</div>

<audio id="audio" src="magnolia.mp3" preload="auto"></audio>

<script>
const audio = document.getElementById("audio");
const intro = document.getElementById("intro");
const scene = document.getElementById("scene");
const poster = document.getElementById("poster");
const lyricsContainer = document.getElementById("lyrics");
const pauseButton = document.getElementById("pauseButton");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("time");
const controls = document.getElementById("controls");

// Semua waktu menggunakan detik relatif dari awal potongan 02:01.
const lyrics = [
    {
        time: 10.22,
        text: "Wrecking balls and millions stones",
        x: 50, y: 27, red: false
    },
    {
        time: 13.00,
        text: "Will never took away",
        x: 50, y: 69, red: true
    },
    {
        time: 17.16,
        text: "My strongest will to say",
        x: 27, y: 43, red: true
    },
    {
        time: 21.06,
        text: "The words you long to hear",
        x: 70, y: 31, red: false
    },
    {
        time: 24.82,
        text: "The city's falling down and down",
        x: 50, y: 60, red: true
    },
    {
        time: 28.45,
        text: "This very old long way",
        x: 30, y: 32, red: false
    },
    {
        time: 31.75,
        text: "I don't need to say more",
        x: 68, y: 66, red: true
    },
    {
        time: 35.34,
        text: "The words you long to hear",
        x: 50, y: 42, red: false
    }
];

const lyricElements = lyrics.map(item => {
    const element = document.createElement("div");
    element.className = "lyric" + (item.red ? " red" : "");
    element.textContent = item.text;
    element.style.left = item.x + "%";
    element.style.top = item.y + "%";
    element.style.transform = "translate(-50%, 10px)";
    lyricsContainer.appendChild(element);
    return element;
});

// Mulai lagu dengan fade-in volume selama 1,5 detik.
function fadeInAudio() {
    audio.volume = 0;
    const startTime = performance.now();
    const duration = 1500;

    function fade(timestamp) {
        const elapsed = timestamp - startTime;
        audio.volume = Math.min(elapsed / duration, 1);

        if (elapsed < duration && !audio.paused) {
            requestAnimationFrame(fade);
        }
    }

    requestAnimationFrame(fade);
}

// Tombol play pertama.
document.getElementById("playButton").addEventListener("click", async () => {
    try {
        await audio.play();

        intro.classList.add("hidden");
        scene.classList.add("visible");
        document.body.classList.add("playing");
        controls.classList.add("visible");

        fadeInAudio();
    } catch (error) {
        alert("Lagu tidak bisa diputar. Pastikan magnolia.mp3 ada di folder yang sama.");
    }
});

// Poster tampil sesaat sebelum lirik pertama.
function updatePoster(time) {
    poster.classList.remove("show", "hide");
    poster.style.opacity = "0";

    if (time >= 2 && time < 10) {
        poster.style.opacity = "";
        poster.classList.add("show");
    } else {
        poster.classList.add("hide");
    }
}

// Tampilkan lirik sesuai waktu lagu.
function updateLyrics(time) {
    lyrics.forEach((item, index) => {
        const nextTime = lyrics[index + 1]
            ? lyrics[index + 1].time
            : Infinity;

        const active = time >= item.time && time < nextTime;
        lyricElements[index].classList.toggle("show", active);
    });
}

function formatTime(seconds) {
    const safe = Math.floor(seconds || 0);
    return Math.floor(safe / 60) + ":" +
        String(safe % 60).padStart(2, "0");
}

audio.addEventListener("timeupdate", () => {
    const time = audio.currentTime;

    updatePoster(time);
    updateLyrics(time);

    progress.value = time;
    timeDisplay.textContent = formatTime(time);
});

audio.addEventListener("loadedmetadata", () => {
    progress.max = audio.duration;
});

pauseButton.addEventListener("click", () => {
    if (audio.paused) {
        audio.play();
        pauseButton.textContent = "Ⅱ";
    } else {
        audio.pause();
        pauseButton.textContent = "▶";
    }
});

progress.addEventListener("input", () => {
    audio.currentTime = Number(progress.value);
    updatePoster(audio.currentTime);
    updateLyrics(audio.currentTime);
});

// Efek salju.
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
let flakes = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    flakes = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 0.5,
        speed: Math.random() * 1.5 + 0.5,
        drift: Math.random() * 0.8 - 0.4,
        opacity: Math.random() * 0.7 + 0.2
    }));
}

function drawSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    flakes.forEach(flake => {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${flake.opacity})`;
        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > canvas.height) {
            flake.y = -5;
            flake.x = Math.random() * canvas.width;
        }

        if (flake.x > canvas.width) flake.x = 0;
        if (flake.x < 0) flake.x = canvas.width;
    });

    requestAnimationFrame(drawSnow);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawSnow();

audio.addEventListener("ended", () => {
    lyricElements.forEach(element => element.classList.remove("show"));
    poster.classList.remove("show");
    poster.classList.add("hide");
    pauseButton.textContent = "▶";
});
</script>

</body>
</html>
